<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마카오 룰렛 · 빔</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="beam">
    <header>
      <div class="title">🎰 MACAU ROULETTE</div>
      <div class="round-tag" id="round-tag"></div>
    </header>

    <!-- 대기 화면 -->
    <section id="b-lobby" class="hidden">
      <div class="lobby-wrap">
        <div>
          <div class="qr-box"><img id="qr" alt="참가 QR" src="/qr.svg"></div>
          <div class="join-url" id="join-url"></div>
        </div>
        <div>
          <div style="font-size:3.4vh;font-weight:800">📱 QR을 찍고 이름과 조를 선택하세요</div>
          <div style="display:flex;align-items:baseline;gap:1.5vw;margin-top:2vh">
            <div class="lobby-big num" id="lobby-count">0</div>
            <div style="font-size:3vh;font-weight:800">명 입장</div>
          </div>
          <div class="lobby-teams" id="lobby-teams"></div>
          <div class="panel" style="margin-top:2.5vh;font-size:2.2vh;line-height:1.7">
            <b class="gold">규칙</b> 칩 1,000개로 시작 · 빨강/검정·홀/짝 2배, 12개 묶음 3배, 숫자 36배<br>
            <b class="gold">우승</b> 조원 <b>1인 평균 칩</b>이 가장 많은 조 · 칩을 다 잃어도 구조 칩 지급
          </div>
        </div>
      </div>
    </section>

    <!-- 게임 화면 -->
    <main id="b-game" class="hidden">
      <div class="left">
        <canvas id="wheel" width="900" height="900"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="right">
        <div class="event hidden" id="event"></div>
        <div class="panel" id="dist-panel">
          <h3><span>칩이 몰린 곳</span><span id="part-panel">베팅 참여 <span class="num" id="part-text"></span></span></h3>
          <div class="progress" id="part-bar-wrap" style="height:1.2vh;margin-bottom:1.2vh"><i id="part-bar" style="width:0"></i></div>
          <div class="dist-grid" id="dist"></div>
        </div>
        <div class="panel hidden" id="winners-panel">
          <h3><span>이번 라운드 TOP</span><span class="muted" id="winner-count"></span></h3>
          <div class="winners" id="winners"></div>
        </div>
        <div class="panel" style="flex:1;min-height:0;overflow:hidden">
          <h3><span>조 순위</span><span class="muted" style="font-size:1.8vh">1인 평균 칩</span></h3>
          <div class="teams-list" id="teams"></div>
        </div>
        <div class="history" id="history"></div>
      </div>
    </main>

    <!-- 최종 -->
    <section id="b-final" class="hidden" style="display:grid;grid-template-columns:2fr 1fr;gap:2vw;min-height:0">
      <div class="podium" id="podium"></div>
      <div class="panel" style="align-self:center">
        <h3><span>🏅 개인 MVP</span></h3>
        <div class="winners" id="mvp"></div>
        <h3 style="margin-top:2vh"><span>전체 조 순위</span></h3>
        <div class="winners" id="all-teams"></div>
      </div>
    </section>
  </div>
  <button class="btn ghost sound-btn" id="sound-btn">🔊 소리 켜기</button>
  <canvas class="confetti" id="confetti"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script src="/beam.js"></script>
</body>
</html>
